<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长图生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.9;
            margin-top: 8px;
        }

        .content {
            padding: 24px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8e8ff;
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #666;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 24px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .setting-group select,
        .setting-group input[type="number"] {
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .setting-group select:focus,
        .setting-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .quality-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quality-wrapper input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        .quality-wrapper input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .quality-wrapper input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .quality-wrapper input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .quality-display {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            min-width: 45px;
            text-align: right;
        }

        .tip {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .images-container {
            margin: 24px 0;
        }

        .images-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .images-header h3 {
            color: #333;
        }

        .image-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .images-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 120px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }

        .images-list.vertical {
            flex-direction: column;
            align-items: center;
        }

        .images-list.horizontal {
            flex-direction: row;
            align-items: flex-start;
        }

        .image-item {
            position: relative;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }

        .image-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .image-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .image-item.drag-over {
            transform: scale(1.05);
            box-shadow: 0 0 0 3px #667eea;
        }

        .image-item img {
            display: block;
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
        }

        .image-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-item:hover .remove-btn {
            opacity: 1;
        }

        .image-item .image-index {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-item .image-time {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .empty-message {
            width: 100%;
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .progress-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .progress-overlay.show {
            display: flex;
        }

        .progress-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 长图生成器</h1>
            <p>上传图片，拖拽排序，一键生成长图</p>
        </div>

        <div class="content">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>点击或拖拽上传图片</h3>
                <p>支持 JPG、PNG、GIF、WebP 格式，可多选</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>

            <div class="settings">
                <div class="setting-group">
                    <label>拼接方向</label>
                    <select id="direction">
                        <option value="vertical">竖向拼接（从上到下）</option>
                        <option value="horizontal">横向拼接（从左到右）</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label id="sizeLabel">统一宽度 (px)</label>
                    <input type="number" id="targetSize" value="1200" min="100" max="8000">
                    <span class="tip">竖拼调宽度，横拼调高度</span>
                </div>
                <div class="setting-group">
                    <label>输出格式</label>
                    <select id="format">
                        <option value="jpeg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>输出质量</label>
                    <div class="quality-wrapper">
                        <input type="range" id="quality" min="10" max="100" value="92" step="1">
                        <span class="quality-display" id="qualityDisplay">92%</span>
                    </div>
                </div>
            </div>

            <div class="images-container" id="imagesContainer" style="display: none;">
                <div class="images-header">
                    <h3>🖼️ 图片列表 <span class="tip">（拖拽调整顺序）</span></h3>
                    <span class="image-count" id="imageCount">0 张</span>
                </div>
                <div class="images-list vertical" id="imagesList">
                    <div class="empty-message">暂无图片</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="clearBtn" style="display: none;">清空全部</button>
                <button class="btn btn-primary" id="generateBtn" disabled>生成长图</button>
            </div>
        </div>
    </div>

    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-box">
            <div class="spinner"></div>
            <p>正在生成长图...</p>
        </div>
    </div>

    <script>
        // 全局状态
        let images = [];
        let draggedItem = null;

        // DOM 元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const directionSelect = document.getElementById('direction');
        const targetSizeInput = document.getElementById('targetSize');
        const sizeLabel = document.getElementById('sizeLabel');
        const formatSelect = document.getElementById('format');
        const qualitySlider = document.getElementById('quality');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const imagesContainer = document.getElementById('imagesContainer');
        const imagesList = document.getElementById('imagesList');
        const imageCount = document.getElementById('imageCount');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressOverlay = document.getElementById('progressOverlay');

        // 事件绑定
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(Array.from(e.target.files));
            fileInput.value = '';
        });

        directionSelect.addEventListener('change', () => {
            const isVertical = directionSelect.value === 'vertical';
            sizeLabel.textContent = isVertical ? '统一宽度 (px)' : '统一高度 (px)';
            imagesList.className = `images-list ${directionSelect.value}`;
        });

        qualitySlider.addEventListener('input', () => {
            qualityDisplay.textContent = qualitySlider.value + '%';
        });

        clearBtn.addEventListener('click', () => {
            images = [];
            renderImages();
        });

        generateBtn.addEventListener('click', generateImage);

        // 处理上传的文件
        async function handleFiles(files) {
            for (const file of files) {
                const img = new Image();
                const url = URL.createObjectURL(file);
                
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                });

                images.push({
                    id: Date.now() + Math.random(),
                    file,
                    img,
                    url,
                    lastModified: file.lastModified
                });
            }

            // 按时间排序（早的在前）
            images.sort((a, b) => a.lastModified - b.lastModified);
            renderImages();
        }

        // 渲染图片列表
        function renderImages() {
            if (images.length === 0) {
                imagesContainer.style.display = 'none';
                clearBtn.style.display = 'none';
                generateBtn.disabled = true;
                imagesList.innerHTML = '<div class="empty-message">暂无图片</div>';
                return;
            }

            imagesContainer.style.display = 'block';
            clearBtn.style.display = 'inline-block';
            generateBtn.disabled = false;
            imageCount.textContent = images.length + ' 张';

            imagesList.innerHTML = '';
            images.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'image-item';
                div.draggable = true;
                div.dataset.id = item.id;

                const time = new Date(item.lastModified);
                const timeStr = `${time.getMonth() + 1}/${time.getDate()} ${time.getHours()}:${String(time.getMinutes()).padStart(2, '0')}`;

                div.innerHTML = `
                    <img src="${item.url}" alt="">
                    <button class="remove-btn" title="删除">✕</button>
                    <span class="image-index">${index + 1}</span>
                    <span class="image-time">${timeStr}</span>
                `;

                // 删除按钮
                div.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    images = images.filter(img => img.id !== item.id);
                    URL.revokeObjectURL(item.url);
                    renderImages();
                });

                // 拖拽事件
                div.addEventListener('dragstart', (e) => {
                    draggedItem = div;
                    div.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                div.addEventListener('dragend', () => {
                    div.classList.remove('dragging');
                    draggedItem = null;
                    document.querySelectorAll('.image-item').forEach(el => el.classList.remove('drag-over'));
                });

                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== div) {
                        div.classList.add('drag-over');
                    }
                });

                div.addEventListener('dragleave', () => {
                    div.classList.remove('drag-over');
                });

                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    
                    if (draggedItem && draggedItem !== div) {
                        const fromId = parseFloat(draggedItem.dataset.id);
                        const toId = parseFloat(div.dataset.id);
                        const fromIndex = images.findIndex(img => img.id === fromId);
                        const toIndex = images.findIndex(img => img.id === toId);
                        
                        if (fromIndex !== -1 && toIndex !== -1) {
                            const [removed] = images.splice(fromIndex, 1);
                            images.splice(toIndex, 0, removed);
                            renderImages();
                        }
                    }
                });

                imagesList.appendChild(div);
            });
        }

        // 生成长图
        async function generateImage() {
            if (images.length === 0) return;

            progressOverlay.classList.add('show');

            try {
                await new Promise(resolve => setTimeout(resolve, 50));

                const isVertical = directionSelect.value === 'vertical';
                const targetSize = parseInt(targetSizeInput.value) || 1200;
                const format = formatSelect.value;
                const quality = parseInt(qualitySlider.value) / 100;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 计算每张图的缩放尺寸
                const scaledImages = images.map(item => {
                    const img = item.img;
                    let w, h;
                    
                    if (isVertical) {
                        w = targetSize;
                        h = (img.height / img.width) * targetSize;
                    } else {
                        h = targetSize;
                        w = (img.width / img.height) * targetSize;
                    }
                    
                    return { img, w: Math.round(w), h: Math.round(h) };
                });

                // 计算画布尺寸
                if (isVertical) {
                    canvas.width = targetSize;
                    canvas.height = scaledImages.reduce((sum, item) => sum + item.h, 0);
                } else {
                    canvas.width = scaledImages.reduce((sum, item) => sum + item.w, 0);
                    canvas.height = targetSize;
                }

                // 绘制图片
                let offset = 0;
                for (const item of scaledImages) {
                    if (isVertical) {
                        ctx.drawImage(item.img, 0, offset, item.w, item.h);
                        offset += item.h;
                    } else {
                        ctx.drawImage(item.img, offset, 0, item.w, item.h);
                        offset += item.w;
                    }
                }

                // 导出并下载
                const mimeType = `image/${format}`;
                const extension = format === 'jpeg' ? 'jpg' : format;
                
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `长图_${Date.now()}.${extension}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    progressOverlay.classList.remove('show');
                }, mimeType, quality);

            } catch (error) {
                console.error('生成失败:', error);
                alert('生成失败，请重试');
                progressOverlay.classList.remove('show');
            }
        }
    </script>
</body>
</html>
